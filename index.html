<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  
    <div class="app">
        <h1 id="title">✈️ My Trip Planner</h1>

        <input type="text" id="taskInput" placeholder="Enter trip plan (e.g., Book Flights, Pack Bags)...">

        <button type="button" id="addBtn">Add to Trip</button>

        <p id="message"></p>

        <p>Total Trip Plans: <span id="taskCount">0</span></p>

        <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
